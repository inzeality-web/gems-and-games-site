<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Products — Gems & Games</title>
            <script>
                // Load products and manage UI with proper re-rendering on socket updates
                (function(){
                    const qs = s => document.querySelector(s);
                    const grid = qs('#products');
                    const qInput = qs('#q');
                    const clearBtn = qs('#clear');
                    let items = [];
                    let sortAsc = true;
                    let uiSetup = false;

                    function createCard(product){
                        const art = document.createElement('article');
                        art.className = 'card';
                        art.dataset.title = product.title || '';
                        art.dataset.category = (product.category||'').toLowerCase();
                        art.dataset.price = String(product.price || 0);

                        art.innerHTML = `
                            <div class="thumb"><img src="${product.image}" alt="${product.title}"></div>
                            <div class="meta">
                                <div>
                                    <div class="title">${product.title}</div>
                                    <div class="cat">${(product.category||'').charAt(0).toUpperCase() + (product.category||'').slice(1)}</div>
                                </div>
                                <div class="price">$${Number(product.price||0).toFixed(2)}</div>
                            </div>
                            <div class="muted">${product.description || ''}</div>
                            <div class="actions">
                                <button class="btn">Details</button>
                                <button class="btn primary">Add to cart</button>
                            </div>
                        `;
                        return art;
                    }

                    function renderProducts(list){
                        grid.innerHTML = '';
                        (list || []).forEach(p => grid.appendChild(createCard(p)));
                        items = Array.from(grid.querySelectorAll('.card'));
                        // after re-render, apply current filters/sort
                        renderFilter();
                    }

                    function renderFilter(){
                        const q = (qInput && qInput.value || '').trim().toLowerCase();
                        items.forEach(card=>{
                            const title = (card.dataset.title||'').toLowerCase();
                            const cat = (card.dataset.category||'').toLowerCase();
                            const matchesQ = !q || title.includes(q) || (card.querySelector('.muted') && card.querySelector('.muted').textContent.toLowerCase().includes(q));
                            const catFilter = grid.dataset.catFilter || 'all';
                            const matchesCat = catFilter === 'all' || cat === catFilter;
                            card.style.display = (matchesQ && matchesCat) ? '' : 'none';
                        });
                    }

                    function setupUI(){
                        if(uiSetup) return; uiSetup = true;
                        // Category buttons
                        document.querySelectorAll('[data-cat]').forEach(btn=>{
                            btn.addEventListener('click', ()=>{
                                document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('primary'));
                                btn.classList.add('primary');
                                grid.dataset.catFilter = btn.dataset.cat;
                                renderFilter();
                            });
                        });

                        // Search and clear
                        if(qInput) qInput.addEventListener('input', renderFilter);
                        if(clearBtn) clearBtn.addEventListener('click', ()=>{ if(qInput){ qInput.value=''; renderFilter(); qInput.focus(); } });

                        // Sort by price
                        const sortBtn = qs('#sortPrice');
                        if(sortBtn){
                            sortBtn.addEventListener('click', (e)=>{
                                sortAsc = !sortAsc;
                                // sort visible items only
                                const visible = items.filter(i=> i.style.display !== 'none');
                                const sorted = visible.slice().sort((a,b)=>{
                                    return sortAsc ? (parseFloat(a.dataset.price)-parseFloat(b.dataset.price)) : (parseFloat(b.dataset.price)-parseFloat(a.dataset.price));
                                });
                                // append sorted nodes in order
                                sorted.forEach(node => grid.appendChild(node));
                                e.target.textContent = `Sort: Price ${sortAsc ? '↑' : '↓'}`;
                            });
                        }

                        // Year
                        const yearEl = qs('#year'); if(yearEl) yearEl.textContent = new Date().getFullYear();

                        // Init defaults
                        const allBtn = qs('[data-cat="all"]'); if(allBtn) allBtn.classList.add('primary');
                        grid.dataset.catFilter = 'all';
                    }

                    // initial load
                    (async function load(){
                        try{
                            const res = await fetch('data/products.json');
                            if(res.ok){
                                const list = await res.json();
                                renderProducts(list);
                            } else {
                                items = Array.from(grid.querySelectorAll('.card'));
                            }
                        }catch(e){ items = Array.from(grid.querySelectorAll('.card')); }
                        setupUI();
                    })();

                    // Socket updates: re-render products when server broadcasts
                    if(typeof io !== 'undefined'){
                        try{
                            const socket = io();
                            socket.on('products', list => {
                                renderProducts(list || []);
                            });
                        }catch(e){ console.warn('socket init failed', e); }
                    }

                })();
            </script>

            <script src="/socket.io/socket.io.js"></script>
        </body>
        </html>
            <article class="card" data-title="Rose Quartz Heart" data-category="gems" data-price="18.00">
                <div class="thumb"><img src="https://via.placeholder.com/400x300?text=Rose+Quartz" alt="Rose quartz heart" /></div>
                <div class="meta">
                    <div>
                        <div class="title">Rose Quartz Heart</div>
                        <div class="cat">Gems • Tumbled</div>
                    </div>
                    <div class="price">$18.00</div>
                </div>
                <div class="muted">Small palm stone for gifting.</div>
                <div class="actions">
                    <button class="btn">Details</button>
                    <button class="btn primary">Add to cart</button>
                </div>
            </article>

            <article class="card" data-title="Collector's Card Pack" data-category="games" data-price="12.00">
                <div class="thumb"><img src="https://via.placeholder.com/400x300?text=Card+Pack" alt="Collector's card pack" /></div>
                <div class="meta">
                    <div>
                        <div class="title">Collector's Card Pack</div>
                        <div class="cat">Games • Cards</div>
                    </div>
                    <div class="price">$12.00</div>
                </div>
                <div class="muted">Random rare card guaranteed in every pack.</div>
                <div class="actions">
                    <button class="btn">Details</button>
                    <button class="btn primary">Add to cart</button>
                </div>
            </article>
        </section>
    </main>

    <footer>
        © <span id="year"></span> Gems & Games — Small-batch treasures for players & collectors.
    </footer>

    <script>
        // Load products from data/products.json and render cards, then attach UI (search/filter/sort)
        (async function(){
            const qs = s => document.querySelector(s);
            const grid = qs('#products');
            const qInput = qs('#q');
            const clearBtn = qs('#clear');
            let items = [];
            let sortAsc = true;

            function createCard(product){
                const art = document.createElement('article');
                art.className = 'card';
                art.dataset.title = product.title;
                art.dataset.category = product.category;
                art.dataset.price = String(product.price);

                art.innerHTML = `
                    <div class="thumb"><img src="${product.image}" alt="${product.title}"></div>
                    <div class="meta">
                        <div>
                            <div class="title">${product.title}</div>
                            <div class="cat">${product.category.charAt(0).toUpperCase() + product.category.slice(1)}</div>
                        </div>
                        <div class="price">$${Number(product.price).toFixed(2)}</div>
                    </div>
                    <div class="muted">${product.description}</div>
                    <div class="actions">
                        <button class="btn">Details</button>
                        <button class="btn primary">Add to cart</button>
                    </div>
                `;
                return art;
            }

            async function loadProducts(){
                try{
                    const res = await fetch('data/products.json');
                    if(!res.ok) throw new Error('No products file');
                    const list = await res.json();
                    grid.innerHTML = '';
                    list.forEach(p => grid.appendChild(createCard(p)));
                    items = Array.from(grid.querySelectorAll('.card'));
                    initUI();
                }catch(err){
                    // If load fails, fallback to existing DOM children (if any)
                    items = Array.from(grid.querySelectorAll('.card'));
                    initUI();
                }
            }

            function renderFilter(){
                const q = qInput.value.trim().toLowerCase();
                items.forEach(card=>{
                    const title = (card.dataset.title||'').toLowerCase();
                    const cat = (card.dataset.category||'').toLowerCase();
                    const matchesQ = !q || title.includes(q) || (card.querySelector('.muted') && card.querySelector('.muted').textContent.toLowerCase().includes(q));
                    const catFilter = grid.dataset.catFilter || 'all';
                    const matchesCat = catFilter === 'all' || cat === catFilter;
                    card.style.display = (matchesQ && matchesCat) ? '' : 'none';
                });
            }

            function initUI(){
                // Category buttons
                document.querySelectorAll('[data-cat]').forEach(btn=>{
                    btn.addEventListener('click', ()=>{
                        document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('primary'));
                        btn.classList.add('primary');
                        grid.dataset.catFilter = btn.dataset.cat;
                        renderFilter();
                    });
                });

                // Search and clear
                if(qInput) qInput.addEventListener('input', renderFilter);
                if(clearBtn) clearBtn.addEventListener('click', ()=>{ if(qInput){ qInput.value=''; renderFilter(); qInput.focus(); } });

                // Sort by price
                const sortBtn = qs('#sortPrice');
                if(sortBtn){
                    sortBtn.addEventListener('click', (e)=>{
                        sortAsc = !sortAsc;
                        const sorted = items.slice().sort((a,b)=>{
                            return sortAsc ? (parseFloat(a.dataset.price)-parseFloat(b.dataset.price)) : (parseFloat(b.dataset.price)-parseFloat(a.dataset.price));
                        });
                        sorted.forEach(node => grid.appendChild(node));
                        e.target.textContent = `Sort: Price ${sortAsc ? '↑' : '↓'}`;
                    });
                }

                // Year
                const yearEl = qs('#year'); if(yearEl) yearEl.textContent = new Date().getFullYear();

                // Init defaults
                const allBtn = qs('[data-cat="all"]'); if(allBtn) allBtn.classList.add('primary');
                grid.dataset.catFilter = 'all';
            }

            await loadProducts();
        })();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/live-products.js"></script>
</body>
</html>
