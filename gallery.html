<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Gallery — Gems & Games</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico.png">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <div class="logo">G&G</div>
            <div>
                <div style="font-size:15px">Gems & Games</div>
                <div style="font-size:12px;margin-top:2px" class="muted">Curated finds for players & collectors</div>
            </div>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="business.html">The Business</a>
            <a href="gallery.html" aria-current="page">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h1 style="margin-top:0">Gallery</h1>
            <p class="muted">A selection of photos and assets from our store.</p>
        </section>
        <section class="image-gallery">
            <figure class="gallery-item">
                <img src="images/placeholder-photo.svg" alt="Store display">
                <figcaption>Store display</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/sprite-sample.svg" alt="Sample sprites">
                <figcaption>Sprite sample</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/icon-star.svg" alt="Star icon">
                <figcaption>Icon artwork</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gems & Games. All rights reserved.</p>
    </footer>
</body>
</html>
