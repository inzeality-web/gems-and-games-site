<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gems & Games</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  
  </footer>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="scripts/live-products.js"></script>
</html>
  </main>

  <script>
    const socket = io(); // connect to your Express + Socket.IO server
    const form = document.getElementById('productForm');
    const productList = document.getElementById('productList');

    // Listen for live updates from server
    socket.on('products', products => {
      productList.innerHTML = '';
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product-item';
        div.innerHTML = `<strong>${p.title}</strong> — $${p.price.toFixed(2)} | ${p.category}`;
        productList.appendChild(div);
      });
    });

    // Submit form
    form.addEventListener('submit', e => {
      e.preventDefault();
      const product = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        price: parseFloat(document.getElementById('price').value),
        image: document.getElementById('image').value,
        description: document.getElementById('description').value
      };
      // Send product to server
      socket.emit('addProduct', product);

      // Clear form for next entry
      form.reset();
    });
  </script>
</body>
</html>
